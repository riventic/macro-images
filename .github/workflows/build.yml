# Builds unofficial Macro images from an upstream release tag and pushes them
# to ghcr.io/riventic/macro-*.
#
# Trust split: jobs that RUN upstream code (cargo build.rs, bun install
# scripts) hold a read-only token and hand their output on as an artifact.
# Only the *-image jobs hold `packages: write`, and they run upstream code only
# inside BuildKit containers, which cannot read the host's registry login.
name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag (e.g. v2026.10.26.1). Empty = latest release."
        required: false
        default: ""
      force:
        description: "Rebuild even if images for this tag exist."
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions: {}

concurrency:
  group: build-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/riventic
  UPSTREAM: macro-inc/macro

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      build: ${{ steps.r.outputs.build }}
    steps:
      - name: Log in to GHCR (read)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: r
        name: Resolve tag and decide whether to build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::unexpected tag format: $tag"; exit 1
          fi
          sha=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha: $sha"; exit 1; }

          build=true
          if [ "$FORCE" != "true" ] && docker manifest inspect "$REGISTRY/macro-services:$tag" >/dev/null 2>&1; then
            echo "Images for $tag already exist; skipping."
            build=false
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "### Macro $tag ($sha) — build: $build" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- services
  services-build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
      # Pin the toolchain rust-toolchain.toml names, without its iOS/Android/
      # musl/wasm targets, which a service build does not use.
      RUSTUP_TOOLCHAIN: "1.94.0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - name: Check out upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macro-inc/macro
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: upstream -> target
          cache-on-failure: true
      - name: Build service binaries
        working-directory: upstream
        run: |
          set -euo pipefail
          # Production features only. Upstream's local stack adds
          # authentication_service/return_passwordless_code + no_rate_limit;
          # those must never ship.
          bins=(
            agent_harness_service
            authentication_service
            calendar_service
            connection_gateway_service
            contacts_service
            document_storage_service
            document_upload_finalizer_local_worker
            email_service
            image_proxy_service
            notification_service
            pubsub_workers
            search_processing_service
            slack_import_worker
            static_file_service
            unfurl_service
          )
          args=(); for b in "${bins[@]}"; do args+=(--bin "$b"); done
          cargo build --release --locked "${args[@]}"

          mkdir -p ../stage/out ../stage/pdfium-lib/linux
          for b in "${bins[@]}"; do
            install -m 0755 "target/release/$b" "../stage/out/$b"
          done
          strip ../stage/out/*
          cp services/search_processing_service/pdfium-lib/linux/libpdfium.so ../stage/pdfium-lib/linux/
          ls -la ../stage/out
          df -h /
      - name: Pack binaries
        run: tar -C stage -czf services.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: services
          path: services.tar.gz
          retention-days: 1
          if-no-files-found: error

  services-image:
    needs: [resolve, services-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: services
      - name: Unpack binaries into the build context
        run: tar -C images/services -xzf services.tar.gz
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/services
          load: true
          tags: macro-services:test
          build-args: |
            MACRO_VERSION=${{ env.TAG }}
            MACRO_REVISION=${{ env.SHA }}
      - name: Smoke test — every binary resolves its shared libraries
        run: |
          docker run --rm --entrypoint sh macro-services:test -c '
            set -e
            for b in /app/out/*; do
              if ldd "$b" | grep -q "not found"; then echo "missing libs: $b"; ldd "$b"; exit 1; fi
            done
            ls -la /app/out /app/pdfium-lib/linux
            deno --version'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/services
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/macro-services:${{ env.TAG }}
          build-args: |
            MACRO_VERSION=${{ env.TAG }}
            MACRO_REVISION=${{ env.SHA }}

  # ------------------------------------------------- upstream Dockerfiles
  # These Dockerfiles are self-contained; build them unchanged.
  node-images:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macro-websocket-service
            dockerfile: docker/websocket-service.Dockerfile
          - image: macro-sync-service
            dockerfile: docker/sync-service.Dockerfile
          - image: macro-lexical-service
            dockerfile: docker/lexical-service.Dockerfile
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macro-inc/macro
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream
          file: upstream/${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.TAG }}
          # lexical-service: no @macro-inc package resolves from
          # npm.pkg.github.com in bun.lock, so the token stays empty.
          build-args: |
            GITHUB_PACKAGES_TOKEN=
          labels: |
            org.opencontainers.image.title=${{ matrix.image }} (unofficial)
            org.opencontainers.image.source=https://github.com/riventic/macro-images
            org.opencontainers.image.url=https://github.com/macro-inc/macro/tree/${{ env.TAG }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  # --------------------------------------------------------------------- web
  web-build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: macro-inc/macro
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5 # upstream package.json `packageManager`
      - name: Install dependencies
        working-directory: upstream
        run: bun install --frozen-lockfile
      - name: Build bundle
        working-directory: upstream/apps/web
        # Same env as upstream's static build (xtask_local frontend::build_static).
        env:
          MODE: development
          NODE_ENV: production
          VITE_LOCAL_SERVERS: ALL
          VITE_LOCAL_BACKEND_ORIGIN: same-origin
          VITE_AI_EDITING_WORKER_URL: /ai-editing
        run: |
          bun run --bun build
          test -f dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: upstream/apps/web/dist
          retention-days: 1
          if-no-files-found: error

  web-image:
    needs: [resolve, web-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: images/web/dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/web
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/macro-web:${{ env.TAG }}
          build-args: |
            MACRO_VERSION=${{ env.TAG }}
            MACRO_REVISION=${{ env.SHA }}
