server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        return 302 /app/;
    }

    # Hashed assets never change for a given file name.
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths under /app/ fall back to the app shell.
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }
}
